<body>
<header class="topbar">
<button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
<a class="brand" href="#"><span class="logo">▶</span> VideoSnathan</a>
<form class="search" id="searchForm"><input id="searchInput" type="search" placeholder="Pesquisar vídeos" autocomplete="off" aria-label="Pesquisar vídeos"><button aria-label="Pesquisar">⌕</button></form>
<div class="actions"><button class="icon-btn" id="uploadBtn" title="Criar">＋</button><button class="icon-btn" id="bellBtn" aria-label="Notificações">🔔</button><button class="avatar" id="accountBtn" aria-label="Conta">N</button></div>
</header>
<aside id="sidebar" class="sidebar">
<a href="#" data-view="home">⌂ <span>Início</span></a><a href="#" data-view="trending">🔥 <span>Em alta</span></a><a href="#" data-view="subscriptions">▣ <span>Inscrições</span></a><hr>
<a href="#" data-view="history">◷ <span>Histórico</span></a><a href="#" data-view="playlists">♡ <span>Salvos</span></a><a href="#" data-view="uploads">▶ <span>Seus vídeos</span></a><hr>
<a href="#" id="settingsBtn">⚙ <span>Configurações</span></a><a href="#" id="reportBtn">🚩 <span>Denunciar</span></a>
</aside>
<main class="main">
<nav class="chips" id="chips"><button class="active">Tudo</button><button>Futebol</button><button>Jogos</button><button>Música</button><button>Tecnologia</button><button>Notícias</button><button>Educação</button><button>Ao vivo</button></nav>
<section><div class="section-title"><h1 id="sectionHeading">Vídeos recomendados</h1><button class="text-btn" id="allBtn">Atualizar</button></div><div class="grid" id="videoGrid"></div></section>
</main>
<div class="modal hidden" id="videoModal"><div class="modal-box video-box"><button class="close" data-close="videoModal">×</button><div id="playerArea" class="player"></div><h2 id="modalTitle"></h2><div id="modalMeta" class="modal-meta"></div><div class="video-actions"><button id="likeBtn">👍 <span>0</span></button><button id="saveBtn">♡ Salvar</button><button id="subscribeBtn">Inscrever-se</button></div><hr><h3>Comentários</h3><form id="commentForm" class="comment-form"><input id="commentInput" placeholder="Adicione um comentário"><button>Comentar</button></form><div id="comments"></div></div></div>
<div class="modal hidden" id="accountModal"><div class="modal-box"><button class="close" data-close="accountModal">×</button><h2>Conta VideoSnathan</h2><input class="field" placeholder="Seu nome" id="accountName"><input class="field" type="email" placeholder="E-mail" id="accountEmail"><input class="field" type="password" placeholder="Senha (mín. 8 caracteres)" id="accountPassword"><div class="video-actions"><button class="primary" id="registerBtn">Criar conta</button><button id="loginBtn">Entrar</button></div><p id="accountStatus">Entre para curtir, comentar, inscrever-se e publicar.</p></div></div>
<div class="modal hidden" id="uploadModal"><div class="modal-box"><button class="close" data-close="uploadModal">×</button><h2>Enviar vídeo</h2><input class="field" id="uploadTitle" placeholder="Título do vídeo"><textarea class="field" id="uploadDescription" placeholder="Descrição"></textarea><input class="field" id="uploadFile" type="file" accept="video/*"><button class="primary full" id="publishBtn">Publicar</button><p id="uploadStatus"></p></div></div>
<div class="toast hidden" id="toast"></div><script src="./app.js"></script>
