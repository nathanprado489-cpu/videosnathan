services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    volumes:
      - video_uploads:/app/uploads
      - video_processed:/app/processed
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file:
      - ./backend/.env
    volumes:
      - video_uploads:/app/uploads
      - video_processed:/app/processed
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videosnathan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      POSTGRES_DB: ${POSTGRES_DB:-videosnathan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videosnathan} -d ${POSTGRES_DB:-videosnathan}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  video_uploads:
  video_processed:
